profile: influx_pp

# Physical sensor dimensions used to convert camera focal length from meters
# into pixel units.
sensor:
  width_m: 0.032
  height_m: 0.018

# Corner displacement is sampled from a truncated Gaussian. Its mean is
# linearly interpolated/extrapolated from two
# [camera focal length in pixels, mean displacement in pixels] control points.
corner_displacement:
  min_px: -50.0
  max_px: 80.0
  std_px: 50.0
  mean_by_focal_px:
    - [1500.0, 20.0]
    - [30000.0, 80.0]

# The top-middle displacement is the sampled corner displacement multiplied by
# this factor, followed by clipping to top_mid_displacement.
top_mid_factor:
  min: -0.10
  max: 0.50
  mean: 0.14285714285714285
  std: 0.15

top_mid_displacement:
  min_px: -25.0
  max_px: 40.0

tangential:
  std: 0.0001
